services:
  postgres:
    image: postgres:14.5
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    healthcheck:
      test: pg_isready
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb
    environment:
      MYSQL_USER: pony
      MYSQL_PASSWORD: pony
      MYSQL_DATABASE: pony
      MYSQL_ROOT_PASSWORD: mysql
    healthcheck:
      test: mariadb-admin ping
      interval: 5s
      timeout: 2s
      retries: 3

  tests:
    image: ghcr.io/redvers/pony-dependency-builder:latest
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    volumes:
      - .:/src/odbc
    working_dir: /src/odbc
    command: sh -c 'git config --global --add safe.directory "*" && make unit-tests'
